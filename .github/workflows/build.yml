name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build src/GamepadKeyboard/GamepadKeyboard.csproj -c Release -p:NuGetAudit=false --nologo -v q

      - name: Publish framework-dependent (requires .NET 8 Desktop Runtime)
        run: dotnet publish src/GamepadKeyboard/GamepadKeyboard.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false -p:NuGetAudit=false -o publish

      - name: Publish uiAccess flavor (keyboard overlay above the Start menu)
        run: dotnet publish src/GamepadKeyboard/GamepadKeyboard.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false -p:NuGetAudit=false -p:ApplicationManifest=app.uiaccess.manifest -o publish-uiaccess

      - name: Zip publish output
        shell: pwsh
        run: |
          Copy-Item installer/Always-on-top-driver-install.bat, installer/Always-on-top-driver-install.ps1 -Destination publish/
          New-Item -ItemType Directory -Force -Path bundle/uiaccess | Out-Null
          Copy-Item publish/* bundle/
          Copy-Item publish-uiaccess/* bundle/uiaccess/
          Compress-Archive -Path bundle/* -DestinationPath DevelopmentGamepadKeyboard-win-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevelopmentGamepadKeyboard-win-x64
          path: DevelopmentGamepadKeyboard-win-x64.zip
          retention-days: 30